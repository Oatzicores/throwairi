name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job here needs to write to the repo, so a compromised
# dependency or action can't push, open releases or edit issues.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (the tag can be moved; the SHA can't).
      # Dependabot (.github/dependabot.yml) opens a PR when a newer version is out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # LayoutProps/PageProps types are generated by next build, so build runs first.
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      # Offline: schema, duplicate ids, sourced-fact contract, stale dates.
      - name: Catalog check
        run: npm run catalog:check
