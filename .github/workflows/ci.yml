name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job here needs to write to the repo, so a compromised
# dependency or action can't push, open releases or edit issues.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (the tag can be moved; the SHA can't).
      # Dependabot (.github/dependabot.yml) opens a PR when a newer version is out.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # LayoutProps/PageProps types are generated by next build, so build runs first.
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      # Offline: schema, duplicate ids, sourced-fact contract, stale dates.
      - name: Catalog check
        run: npm run catalog:check
